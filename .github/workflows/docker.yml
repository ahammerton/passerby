# Runs the tests on every supported Python version, then builds the image for
# amd64 and arm64 and publishes it to GitHub's container registry as
# ghcr.io/<owner>/passerby, and to Docker Hub as cyrune/passerby when the
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are set. Nothing is published
# if any test fails.
#   push to main      -> :latest and :sha-<short sha>
#   tag v1.2.3        -> :1.2.3, :1.2 and :1
#   pull request      -> build only, nothing published
# rebuild.yml starts it every week too, so the images get their base image's security fixes.
name: docker
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    # GitHub only: Gitea Actions also runs .github/workflows, but can't publish to GHCR.
    # (The image job needs this one, so it's skipped too.)
    if: github.repository_owner == 'ahammerton'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -v
      - name: Front-end syntax
        run: node --check ../frontend/app.js && node --check ../frontend/settings.js

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/passerby
            name=docker.io/cyrune/passerby,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          # :latest is main only. Otherwise a release's build would move it as well.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Passerby
            org.opencontainers.image.description=Live planes, trains and buses passing your home

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Lists the image's packages, so scanners needn't guess them.
          sbom: true
          # The weekly rebuild reinstalls everything, for fixes in unpinned packages.
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub's repository page: a short overview (the README is over its 25 KB limit).
      - name: Docker Hub description
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: cyrune/passerby
          short-description: Live planes, trains and buses passing your home
          readme-filepath: ./docs/DOCKERHUB.md

  # Fails on high severity vulnerabilities that have a fix. A separate job, so the scanner never sees
  # the publishing logins, and so a new vulnerability doesn't hold back an image that fixes others.
  scan:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: passerby:scan
          no-cache: ${{ github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha

      - name: Scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: passerby:scan
          severity-cutoff: high
          only-fixed: true
          output-format: table
